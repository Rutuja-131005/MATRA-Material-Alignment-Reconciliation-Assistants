<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07192F" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="layer-card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#112A4A" />
      <stop offset="100%" stop-color="#0D213B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="440" rx="20" fill="url(#arch-bg)" stroke="#1E3A8A" stroke-width="2" />

  <!-- Title Header -->
  <text x="40" y="48" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    MATRA — SYSTEM ARCHITECTURE DIAGRAM
  </text>
  <text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
    Multi-Tier Sovereign Enterprise AI Layer &amp; Integration Hub (SIH26099)
  </text>

  <!-- Tier 1: Presentation Layer -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="1120" height="60" rx="10" fill="url(#layer-card)" stroke="#2563EB" stroke-width="1.5" />
    <rect x="20" y="15" width="160" height="30" rx="6" fill="#1E40AF" />
    <text x="100" y="35" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">PRESENTATION TIER</text>
    <text x="210" y="36" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">React 19 SPA</text>
    <text x="310" y="36" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">• TypeScript</text>
    <text x="410" y="36" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">• TailwindCSS 4</text>
    <text x="540" y="36" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">• Vite 8 Bundler</text>
    <text x="670" y="36" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">• Lucide Icons</text>
    <text x="790" y="36" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">• Executive Navy UX</text>
    <rect x="960" y="15" width="140" height="30" rx="6" fill="#1E293B" />
    <text x="1030" y="35" font-family="JetBrains Mono, monospace" font-size="10" fill="#60A5FA" text-anchor="middle">Port: 3000</text>
  </g>

  <!-- Down Connection 1 -->
  <path d="M 600 160 L 600 180" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="4 2" />
  <polygon points="595,178 600,185 605,178" fill="#3B82F6" />

  <!-- Tier 2: API Gateway & Security Tier -->
  <g transform="translate(40, 185)" filter="url(#shadow)">
    <rect width="1120" height="60" rx="10" fill="url(#layer-card)" stroke="#2563EB" stroke-width="1.5" />
    <rect x="20" y="15" width="160" height="30" rx="6" fill="#1D4ED8" />
    <text x="100" y="35" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">API &amp; SECURITY TIER</text>
    <text x="210" y="36" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">FastAPI (ASGI)</text>
    <text x="330" y="36" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">• SlowAPI Rate Limiter</text>
    <text x="500" y="36" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">• Pydantic Validation</text>
    <text x="660" y="36" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">• CORS &amp; Auth Bearer</text>
    <text x="810" y="36" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8">• Swagger OpenAPI</text>
    <rect x="960" y="15" width="140" height="30" rx="6" fill="#1E293B" />
    <text x="1030" y="35" font-family="JetBrains Mono, monospace" font-size="10" fill="#60A5FA" text-anchor="middle">Port: 8000</text>
  </g>

  <!-- Down Connection 2 -->
  <path d="M 600 245 L 600 265" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="4 2" />
  <polygon points="595,263 600,270 605,263" fill="#3B82F6" />

  <!-- Tier 3: Core Processing & AI Intelligence Tier -->
  <g transform="translate(40, 270)" filter="url(#shadow)">
    <rect width="1120" height="70" rx="10" fill="url(#layer-card)" stroke="#60A5FA" stroke-width="2" />
    <rect x="20" y="20" width="160" height="30" rx="6" fill="#2563EB" />
    <text x="100" y="40" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">HARMONIZATION TIER</text>
    <rect x="200" y="15" width="270" height="40" rx="6" fill="#1E3A8A" />
    <text x="335" y="32" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rule &amp; Normalization Engine</text>
    <text x="335" y="47" font-family="Inter, sans-serif" font-size="10" fill="#93C5FD" text-anchor="middle">Regex Dictionaries • Unit Standardizer</text>
    <rect x="490" y="15" width="290" height="40" rx="6" fill="#1D4ED8" />
    <text x="635" y="32" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI &amp; Fuzzy Matching Engine</text>
    <text x="635" y="47" font-family="Inter, sans-serif" font-size="10" fill="#93C5FD" text-anchor="middle">Google Gemini LLM • RapidFuzz Token Match</text>
    <rect x="800" y="15" width="300" height="40" rx="6" fill="#065F46" />
    <text x="950" y="32" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">Conflict &amp; Governance Resolver</text>
    <text x="950" y="47" font-family="Inter, sans-serif" font-size="10" fill="#D1FAE5" text-anchor="middle">Critical Property Checker • Reason Validator</text>
  </g>

  <!-- Down Connection 3 -->
  <path d="M 600 340 L 600 355" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="4 2" />
  <polygon points="595,353 600,360 605,353" fill="#3B82F6" />

  <!-- Tier 4: Data & Integration Storage Tier -->
  <g transform="translate(40, 360)" filter="url(#shadow)">
    <rect width="1120" height="60" rx="10" fill="url(#layer-card)" stroke="#10B981" stroke-width="1.5" />
    <rect x="20" y="15" width="160" height="30" rx="6" fill="#065F46" />
    <text x="100" y="35" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">DATA &amp; INTEGRATION</text>
    <text x="210" y="36" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">SQLAlchemy 2.0 ORM</text>
    <text x="360" y="36" font-family="Inter, sans-serif" font-size="12" fill="#A7F3D0">• SQLite (nmihp.db)</text>
    <text x="510" y="36" font-family="Inter, sans-serif" font-size="12" fill="#A7F3D0">• Statutory Audit Log</text>
    <text x="680" y="36" font-family="Inter, sans-serif" font-size="12" fill="#A7F3D0">• National Material Catalog (NMC)</text>
    <rect x="940" y="15" width="160" height="30" rx="6" fill="#047857" />
    <text x="1020" y="35" font-family="JetBrains Mono, monospace" font-size="10" fill="#FFFFFF" text-anchor="middle">SAP / ERP Webhook API</text>
  </g>
</svg>
