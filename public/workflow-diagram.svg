<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07192F" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112A4A" />
      <stop offset="100%" stop-color="#0D213B" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="1200" height="380" rx="20" fill="url(#bg-grad)" stroke="#1E3A8A" stroke-width="2" />

  <!-- Title Header -->
  <text x="40" y="48" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    MATRA — MINIMAL SYSTEM WORKFLOW
  </text>
  <text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
    End-to-End Cross-CPSE Material Master Standardization &amp; Resolution Process
  </text>

  <!-- Step 1 Card -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="190" height="220" rx="14" fill="url(#card-grad)" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="35" cy="35" r="18" fill="#1E40AF" opacity="0.6" />
    <text x="35" y="41" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#60A5FA">📥</text>
    <rect x="65" y="24" width="105" height="22" rx="6" fill="#1E3A8A" />
    <text x="117" y="39" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">STEP 1</text>
    <text x="20" y="85" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1. Ingest Data</text>
    <text x="20" y="112" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Raw CPSE Logs</text>
    <text x="20" y="132" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• IOCL, CPCL, NTPC</text>
    <text x="20" y="150" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• CSV / ERP Import</text>
    <text x="20" y="168" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Legacy catalogs</text>
    <rect x="20" y="186" width="150" height="20" rx="4" fill="#1E293B" />
    <text x="95" y="200" font-family="JetBrains Mono, monospace" font-size="10" fill="#60A5FA" text-anchor="middle">CS PIPE 100NB</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 242 215 L 268 215" stroke="#3B82F6" stroke-width="3" stroke-dasharray="4 2" />
  <polygon points="268,210 278,215 268,220" fill="#3B82F6" />

  <!-- Step 2 Card -->
  <g transform="translate(285, 105)" filter="url(#shadow)">
    <rect width="190" height="220" rx="14" fill="url(#card-grad)" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="35" cy="35" r="18" fill="#1E40AF" opacity="0.6" />
    <text x="35" y="41" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#60A5FA">⚡</text>
    <rect x="65" y="24" width="105" height="22" rx="6" fill="#1E3A8A" />
    <text x="117" y="39" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">STEP 2</text>
    <text x="20" y="85" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2. Normalize</text>
    <text x="20" y="112" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Text &amp; Unit Rules</text>
    <text x="20" y="132" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Abbreviation Map</text>
    <text x="20" y="150" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Unit conversion</text>
    <text x="20" y="168" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Whitespace clean</text>
    <rect x="20" y="186" width="150" height="20" rx="4" fill="#1E293B" />
    <text x="95" y="200" font-family="JetBrains Mono, monospace" font-size="10" fill="#60A5FA" text-anchor="middle">CS → CARBON STEEL</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 487 215 L 513 215" stroke="#3B82F6" stroke-width="3" stroke-dasharray="4 2" />
  <polygon points="513,210 523,215 513,220" fill="#3B82F6" />

  <!-- Step 3 Card (AI Highlight) -->
  <g transform="translate(530, 105)" filter="url(#shadow)">
    <rect width="190" height="220" rx="14" fill="url(#card-grad)" stroke="#60A5FA" stroke-width="2.5" />
    <circle cx="35" cy="35" r="18" fill="#2563EB" />
    <text x="35" y="41" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#FFFFFF">🤖</text>
    <rect x="65" y="24" width="105" height="22" rx="6" fill="#2563EB" />
    <text x="117" y="39" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">STEP 3 (AI)</text>
    <text x="20" y="85" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3. AI Harmonize</text>
    <text x="20" y="112" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#93C5FD">Gemini &amp; Fuzzy AI</text>
    <text x="20" y="132" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Spec extraction</text>
    <text x="20" y="150" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Similarity scoring</text>
    <text x="20" y="168" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Conflict detection</text>
    <rect x="20" y="186" width="150" height="20" rx="4" fill="#1E3A8A" />
    <text x="95" y="200" font-family="JetBrains Mono, monospace" font-size="10" fill="#93C5FD" text-anchor="middle">Score: 98.4% Match</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 732 215 L 758 215" stroke="#3B82F6" stroke-width="3" stroke-dasharray="4 2" />
  <polygon points="758,210 768,215 758,220" fill="#3B82F6" />

  <!-- Step 4 Card -->
  <g transform="translate(775, 105)" filter="url(#shadow)">
    <rect width="190" height="220" rx="14" fill="url(#card-grad)" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="35" cy="35" r="18" fill="#1E40AF" opacity="0.6" />
    <text x="35" y="41" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#60A5FA">🛡️</text>
    <rect x="65" y="24" width="105" height="22" rx="6" fill="#1E3A8A" />
    <text x="117" y="39" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">STEP 4</text>
    <text x="20" y="85" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4. Human Review</text>
    <text x="20" y="112" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Officer Approval</text>
    <text x="20" y="132" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Role-based review</text>
    <text x="20" y="150" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Spec conflict check</text>
    <text x="20" y="168" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">• Mandatory reason</text>
    <rect x="20" y="186" width="150" height="20" rx="4" fill="#065F46" />
    <text x="95" y="200" font-family="JetBrains Mono, monospace" font-size="10" fill="#34D399" text-anchor="middle">✓ APPROVED</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 977 215 L 1003 215" stroke="#3B82F6" stroke-width="3" stroke-dasharray="4 2" />
  <polygon points="1003,210 1013,215 1003,220" fill="#3B82F6" />

  <!-- Step 5 Card -->
  <g transform="translate(1020, 105)" filter="url(#shadow)">
    <rect width="140" height="220" rx="14" fill="url(#card-grad)" stroke="#10B981" stroke-width="2" />
    <circle cx="35" cy="35" r="18" fill="#065F46" />
    <text x="35" y="41" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#FFFFFF">🚀</text>
    <rect x="60" y="24" width="65" height="22" rx="6" fill="#065F46" />
    <text x="92" y="39" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#A7F3D0" text-anchor="middle">STEP 5</text>
    <text x="15" y="85" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">5. NMC &amp; SAP</text>
    <text x="15" y="112" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#A7F3D0">ERP Integration</text>
    <text x="15" y="132" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">• National Code</text>
    <text x="15" y="150" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">• SAP Webhook</text>
    <text x="15" y="168" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">• Audit Trail</text>
    <rect x="10" y="186" width="120" height="20" rx="4" fill="#047857" />
    <text x="70" y="200" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" text-anchor="middle">NMC-PIPE-000184</text>
  </g>
</svg>
