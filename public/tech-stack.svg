<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="ts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07192F" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="ts-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112A4A" />
      <stop offset="100%" stop-color="#0D213B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="20" fill="url(#ts-bg)" stroke="#1E3A8A" stroke-width="2" />

  <!-- Title Header -->
  <text x="40" y="48" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    MATRA — TECHNOLOGY STACK MATRIX
  </text>
  <text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
    Production Stack Components &amp; Architecture Specifications
  </text>

  <!-- Column 1: Frontend Stack -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="260" height="280" rx="14" fill="url(#ts-card)" stroke="#2563EB" stroke-width="1.5" />
    <rect x="20" y="20" width="220" height="32" rx="6" fill="#1E40AF" />
    <text x="130" y="41" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">🎨 FRONTEND STACK</text>
    
    <g transform="translate(20, 70)">
      <rect width="220" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">React 19</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">Core Framework</text>
    </g>
    <g transform="translate(20, 115)">
      <rect width="220" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">TypeScript 5.7</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">Type Safety</text>
    </g>
    <g transform="translate(20, 160)">
      <rect width="220" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">TailwindCSS 4</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">Styling Engine</text>
    </g>
    <g transform="translate(20, 205)">
      <rect width="220" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Vite 8.3</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">Build Bundler</text>
    </g>
  </g>

  <!-- Column 2: Backend Stack -->
  <g transform="translate(325, 105)" filter="url(#shadow)">
    <rect width="260" height="280" rx="14" fill="url(#ts-card)" stroke="#2563EB" stroke-width="1.5" />
    <rect x="20" y="20" width="220" height="32" rx="6" fill="#1D4ED8" />
    <text x="130" y="41" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">⚙️ BACKEND STACK</text>
    
    <g transform="translate(20, 70)">
      <rect width="220" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Python 3.13</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">Runtime</text>
    </g>
    <g transform="translate(20, 115)">
      <rect width="220" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">FastAPI 0.115</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">REST API Framework</text>
    </g>
    <g transform="translate(20, 160)">
      <rect width="220" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Uvicorn 0.32</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">ASGI Web Server</text>
    </g>
    <g transform="translate(20, 205)">
      <rect width="220" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Pydantic 2.11</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#60A5FA" text-anchor="end">Data Validation</text>
    </g>
  </g>

  <!-- Column 3: AI / ML & Search -->
  <g transform="translate(610, 105)" filter="url(#shadow)">
    <rect width="260" height="280" rx="14" fill="url(#ts-card)" stroke="#60A5FA" stroke-width="2" />
    <rect x="20" y="20" width="220" height="32" rx="6" fill="#2563EB" />
    <text x="130" y="41" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">🤖 AI / ML &amp; SEARCH</text>
    
    <g transform="translate(20, 70)">
      <rect width="220" height="34" rx="6" fill="#1E3A8A" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Google Gemini AI</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#93C5FD" text-anchor="end">Harmonization LLM</text>
    </g>
    <g transform="translate(20, 115)">
      <rect width="220" height="34" rx="6" fill="#1E3A8A" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">RapidFuzz 3.14</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#93C5FD" text-anchor="end">Fuzzy Matching</text>
    </g>
    <g transform="translate(20, 160)">
      <rect width="220" height="34" rx="6" fill="#1E3A8A" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Regex Normalizer</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#93C5FD" text-anchor="end">Unit Standardizer</text>
    </g>
    <g transform="translate(20, 205)">
      <rect width="220" height="34" rx="6" fill="#1E3A8A" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Conflict Resolver</text>
      <text x="205" y="22" font-family="Inter, sans-serif" font-size="10" fill="#93C5FD" text-anchor="end">Safety Guardrails</text>
    </g>
  </g>

  <!-- Column 4: Database & Security -->
  <g transform="translate(895, 105)" filter="url(#shadow)">
    <rect width="265" height="280" rx="14" fill="url(#ts-card)" stroke="#10B981" stroke-width="1.5" />
    <rect x="20" y="20" width="225" height="32" rx="6" fill="#065F46" />
    <text x="132" y="41" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">🗄️ DATA &amp; SECURITY</text>
    
    <g transform="translate(20, 70)">
      <rect width="225" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">SQLAlchemy 2.0</text>
      <text x="210" y="22" font-family="Inter, sans-serif" font-size="10" fill="#34D399" text-anchor="end">ORM Engine</text>
    </g>
    <g transform="translate(20, 115)">
      <rect width="225" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">SQLite 3</text>
      <text x="210" y="22" font-family="Inter, sans-serif" font-size="10" fill="#34D399" text-anchor="end">nmihp.db Database</text>
    </g>
    <g transform="translate(20, 160)">
      <rect width="225" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">SlowAPI &amp; CORS</text>
      <text x="210" y="22" font-family="Inter, sans-serif" font-size="10" fill="#34D399" text-anchor="end">Rate Limit &amp; Security</text>
    </g>
    <g transform="translate(20, 205)">
      <rect width="225" height="34" rx="6" fill="#1E293B" />
      <text x="15" y="22" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">SAP Webhook API</text>
      <text x="210" y="22" font-family="Inter, sans-serif" font-size="10" fill="#34D399" text-anchor="end">ERP Integration</text>
    </g>
  </g>
</svg>
